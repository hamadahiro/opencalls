<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#f5f2ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Open Calls for Artists 2026 — Photography Grants, Exhibitions, Residencies</title>
  <meta name="description" content="Free curated list of open calls for photographers and visual artists. Alternative process photography, analog, experimental art exhibitions, grants, photobook publishing, zines, and artist residencies. Updated regularly.">
  <meta name="keywords" content="open calls for artists, photography grants 2026, alternative photography, analog photography exhibition, artist residency, photobook open call, art grants, experimental photography, cyanotype, chemigram, darkroom, zine submissions">
  <link rel="canonical" href="https://opencalls.monographica.com/">
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="apple-touch-icon.jpg">
  <meta property="og:title" content="Open Calls for Artists 2026 — Photography Grants, Exhibitions, Residencies">
  <meta property="og:description" content="Free curated list of open calls for photographers and visual artists. Alternative process, analog, experimental art. Grants, exhibitions, residencies, photobooks.">
  <meta property="og:image" content="https://opencalls.monographica.com/og-image.jpg">
  <meta property="og:url" content="https://opencalls.monographica.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="index, follow">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Open Calls for Artists 2026",
    "description": "Free curated list of open calls for photographers and visual artists working with alternative process, analog, and experimental photography.",
    "url": "https://opencalls.monographica.com",
    "publisher": {
      "@type": "Organization",
      "name": "Monographica",
      "url": "https://monographica.com"
    }
  }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="https://monographica.com" class="logo">Monographica</a>
      <nav>
        <a href="#" class="nav-link active" data-view="new">New</a>
        <a href="#" class="nav-link" data-view="past">Past</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Open Calls for Artists</h1>
      <p class="subtitle">A curated list of exhibitions, grants, residencies, and publication opportunities for photographers and visual artists working with analog, experimental, and alternative processes.</p>
      <p class="updated" id="lastUpdated"></p>
    </section>

    <section class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="photography">Photography</button>
      <button class="filter-btn" data-filter="exhibition">Exhibitions</button>
      <button class="filter-btn" data-filter="grant">Grants</button>
      <button class="filter-btn" data-filter="zine">Zines & Books</button>
      <button class="filter-btn" data-filter="residency">Residencies</button>
      <button class="filter-btn" data-filter="education">Education</button>
    </section>

    <section class="calls-list" id="callsList">
      <!-- populated by JS -->
    </section>

    <footer class="about-section" id="footer">
      <p>&copy; <script>document.write(new Date().getFullYear())</script> HH &mdash; still making sense of things.</p>
    </footer>
  </main>

  <script>
    let allCalls = [];
    let currentView = 'new';

    async function loadCalls() {
      const res = await fetch('data.json');
      const data = await res.json();
      allCalls = data.calls;

      document.getElementById('lastUpdated').textContent = 'Last updated: ' + data.lastUpdated;

      renderCalls('new');
      setupNav();
      setupFilters();
    }

    function renderCalls(view) {
      const container = document.getElementById('callsList');
      container.innerHTML = '';
      const now = new Date();

      const sorted = [...allCalls].sort((a, b) => {
        if (a.deadline === 'Rolling' && b.deadline === 'Rolling') return 0;
        if (a.deadline === 'Rolling') return 1;
        if (b.deadline === 'Rolling') return -1;
        return new Date(a.deadline) - new Date(b.deadline);
      });

      const categoryLabel = {
        'photography': 'Photography',
        'exhibition': 'Exhibition',
        'grant': 'Grant',
        'zine': 'Zines & Books',
        'residency': 'Residency',
        'education': 'Education'
      };

      sorted.forEach(call => {
        const deadlineDate = call.deadline === 'Rolling' ? null : new Date(call.deadline);
        const daysLeft = deadlineDate ? Math.ceil((deadlineDate - now) / (1000 * 60 * 60 * 24)) : null;

        let urgencyClass = '';
        let urgencyText = '';
        if (call.deadline === 'Rolling') {
          urgencyText = 'Rolling';
          urgencyClass = 'rolling';
        } else if (daysLeft !== null && daysLeft < 0) {
          urgencyText = 'Closed';
          urgencyClass = 'closed';
        } else if (daysLeft !== null && daysLeft === 0) {
          urgencyText = 'Ends today';
          urgencyClass = 'urgent';
        } else if (daysLeft !== null && daysLeft <= 14) {
          urgencyText = daysLeft + ' days left';
          urgencyClass = 'urgent';
        } else if (daysLeft !== null && daysLeft <= 30) {
          urgencyText = daysLeft + ' days left';
          urgencyClass = 'soon';
        } else if (deadlineDate) {
          urgencyText = deadlineDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          urgencyClass = 'normal';
        }

        // Filter based on view
        if (view === 'new' && urgencyClass === 'closed') return;
        if (view === 'past' && urgencyClass !== 'closed') return;

        const card = document.createElement('div');
        card.className = 'call-card';
        card.dataset.category = call.category;

        const metaParts = [];
        if (call.prize) metaParts.push(`<span class="call-prize">${call.prize}</span>`);
        if (call.location) metaParts.push(call.location);
        metaParts.push(categoryLabel[call.category] || call.category);
        if (call.fee && call.fee !== 'Check website') metaParts.push(call.fee);
        metaParts.push(`<span class="call-deadline ${urgencyClass}">${urgencyText}</span>`);

        card.innerHTML = `
          <h3 class="call-title"><a href="${call.url}" target="_blank">${call.title}</a></h3>
          <p class="call-org">${call.org}</p>
          <p class="call-meta">${metaParts.join(' · ')}</p>
          <p class="call-description">${call.description}</p>
        `;

        container.appendChild(card);
      });

      if (container.children.length === 0) {
        container.innerHTML = '<p class="empty-state">No calls in this section yet.</p>';
      }
    }

    function setupNav() {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const view = link.dataset.view;

          document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
          link.classList.add('active');

          currentView = view;
          renderCalls(view);
          // Reset filter to All
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');

          // Update hero text
          const h1 = document.querySelector('.hero h1');
          if (view === 'past') {
            h1.textContent = 'Past Open Calls';
          } else {
            h1.textContent = 'Open Calls for Artists';
          }
        });
      });
    }

    function setupFilters() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          document.querySelectorAll('.call-card').forEach(card => {
            if (filter === 'all' || card.dataset.category === filter) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          });
        });
      });
    }

    loadCalls();
  </script>

</body>
</html>

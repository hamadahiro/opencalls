<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#f5f2ed">
  <title>Categories - Open Calls for Artists - Monographica</title>
  <meta name="description" content="Browse open calls by category. Photography competitions, exhibitions, grants, artist residencies, zines and photobooks, and education opportunities.">
  <meta name="keywords" content="photography open calls, exhibition submissions, artist grants, artist residencies, photobook open calls, zine submissions, photography education">
  <link rel="canonical" href="https://opencalls.monographica.com/categories">
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="apple-touch-icon.jpg">
  <meta property="og:title" content="Categories - Open Calls for Artists - Monographica">
  <meta property="og:description" content="Browse open calls by category. Photography competitions, exhibitions, grants, artist residencies, zines and photobooks, and education opportunities.">
  <meta property="og:image" content="https://opencalls.monographica.com/og-image.jpg">
  <meta property="og:url" content="https://opencalls.monographica.com/categories">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260317b">
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="https://monographica.com" class="logo">Monographica</a>
      <nav>
        <a href="/" class="nav-link">Open</a>
        <a href="/?view=past" class="nav-link">Closed</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <nav class="breadcrumbs"><a href="/">All open calls</a> / <span>Categories</span></nav>
      <h1>Categories</h1>
      <h2 class="subtitle">Browse open calls by category.</h2>
    </section>

    <section class="index-list" id="indexList"></section>

    <footer class="about-section" id="footer">
      <p class="disclaimer">Information is provided for convenience. Details may change. Always verify them on the official call website.</p>
      <p>&copy; <script>document.write(new Date().getFullYear())</script> HH &mdash; still making sense of things.</p>
    </footer>
  </main>

  <script>
    const categoryLabel = {
      'photography': 'Photography',
      'exhibition': 'Exhibitions',
      'grant': 'Grants',
      'zine': 'Zines & Books',
      'residency': 'Residencies',
      'education': 'Education'
    };

    const categorySlug = {
      'photography': 'photography',
      'exhibition': 'exhibitions',
      'grant': 'grants',
      'zine': 'zines',
      'residency': 'residencies',
      'education': 'education'
    };

    async function load() {
      const res = await fetch('/data.json');
      const data = await res.json();
      const container = document.getElementById('indexList');

      const counts = {};
      data.calls.forEach(c => {
        counts[c.category] = (counts[c.category] || 0) + 1;
      });

      const order = ['education', 'exhibition', 'grant', 'photography', 'residency', 'zine'];

      let html = '';
      order.forEach(cat => {
        const count = counts[cat] || 0;
        html += `<a href="/${categorySlug[cat]}" class="index-item">
          <span class="index-item-name">${categoryLabel[cat]}</span>
          <span class="index-item-dots"></span>
          <span class="index-item-count">${count}</span>
        </a>`;
      });

      container.innerHTML = html;
    }
    load();
  </script>

</body>
</html>
